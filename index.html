<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CRUD Móvil Google Sheets</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body { -webkit-tap-highlight-color: transparent; }
  </style>
</head>
<body class="bg-gray-100 text-gray-800 font-sans antialiased min-h-screen flex flex-col justify-between">

  <!-- Header Fijo -->
  <header class="bg-indigo-600 text-white p-4 sticky top-0 z-30 shadow-md flex justify-between items-center">
    <div class="flex items-center space-x-2">
      <i class="fa-solid fa-table-cells text-xl"></i>
      <h1 class="text-lg font-bold tracking-wide">Gestión PoC</h1>
    </div>
    <button onclick="fetchRecords()" class="text-white hover:text-indigo-200 focus:outline-none">
      <i id="refresh-icon" class="fa-solid fa-rotate-right text-lg"></i>
    </button>
  </header>

  <!-- Contenido Principal -->
  <main class="flex-1 p-4 pb-24 max-w-md mx-auto w-full">
    
    <!-- Barra de Configuración de API -->
    <div class="bg-white p-3 rounded-xl shadow-sm mb-4 border border-gray-200">
      <label class="block text-xs font-semibold text-gray-500 uppercase tracking-wider mb-1">URL Google Apps Script</label>
      <div class="flex gap-2">
        <input type="url" id="api-url" placeholder="https://script.google.com/macros/s/.../exec" 
               class="w-full text-xs p-2 border rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none">
        <button onclick="saveApiUrl()" class="bg-indigo-600 text-white text-xs px-3 py-2 rounded-lg font-medium hover:bg-indigo-700">
          Guardar
        </button>
      </div>
    </div>

    <!-- Buscador -->
    <div class="relative mb-4">
      <i class="fa-solid fa-magnifying-glass absolute left-3 top-3 text-gray-400"></i>
      <input type="text" id="search-input" onkeyup="filterRecords()" placeholder="Buscar registro..." 
             class="w-full pl-10 pr-4 py-2 bg-white rounded-xl shadow-sm border border-gray-200 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
    </div>

    <!-- Spinner de carga -->
    <div id="loader" class="hidden text-center py-8">
      <i class="fa-solid fa-circle-notch fa-spin text-3xl text-indigo-600"></i>
      <p class="text-xs text-gray-500 mt-2">Cargando datos desde Google Sheets...</p>
    </div>

    <!-- Lista de Registros -->
    <div id="records-list" class="space-y-3">
      <!-- Los registros se cargan dinámicamente aquí -->
    </div>
  </main>

  <!-- Botón Flotante para Añadir -->
  <div class="fixed bottom-6 right-6 z-20">
    <button onclick="openModal('create')" class="bg-indigo-600 text-white w-14 h-14 rounded-full shadow-lg flex items-center justify-center text-2xl hover:bg-indigo-700 active:scale-95 transition">
      <i class="fa-solid fa-plus"></i>
    </button>
  </div>

  <!-- Modal Formulario (Crear / Editar) -->
  <div id="modal" class="fixed inset-0 bg-black bg-opacity-50 z-40 hidden flex items-end sm:items-center justify-center p-0 sm:p-4">
    <div class="bg-white w-full max-w-md rounded-t-2xl sm:rounded-2xl p-5 shadow-2xl transition-transform transform duration-300 translate-y-0">
      <div class="flex justify-between items-center mb-4 border-b pb-2">
        <h2 id="modal-title" class="text-lg font-bold text-gray-800">Nuevo Registro</h2>
        <button onclick="closeModal()" class="text-gray-400 hover:text-gray-600 text-xl">&times;</button>
      </div>

      <form id="record-form" onsubmit="handleSubmit(event)" class="space-y-3">
        <input type="hidden" id="field-id">
        
        <div>
          <label class="block text-xs font-semibold text-gray-600 mb-1">Nombre / Título</label>
          <input type="text" id="field-nombre" required class="w-full p-2.5 border rounded-lg text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none">
        </div>

        <div>
          <label class="block text-xs font-semibold text-gray-600 mb-1">Categoría</label>
          <input type="text" id="field-categoria" class="w-full p-2.5 border rounded-lg text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none">
        </div>

        <div>
          <label class="block text-xs font-semibold text-gray-600 mb-1">Estado</label>
          <select id="field-estado" class="w-full p-2.5 border rounded-lg text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none">
            <option value="Pendiente">Pendiente</option>
            <option value="En Proceso">En Proceso</option>
            <option value="Completado">Completado</option>
          </select>
        </div>

        <div class="pt-3 flex gap-2">
          <button type="button" onclick="closeModal()" class="w-1/2 py-2.5 border border-gray-300 text-gray-600 rounded-lg text-sm font-medium hover:bg-gray-50">Cancelar</button>
          <button type="submit" id="submit-btn" class="w-1/2 py-2.5 bg-indigo-600 text-white rounded-lg text-sm font-medium hover:bg-indigo-700">Guardar</button>
        </div>
      </form>
    </div>
  </div>

  <script>
    let rawData = [];
    let currentApiUrl = localStorage.getItem('poc_script_url') || '';

    document.addEventListener('DOMContentLoaded', () => {
      if (currentApiUrl) {
        document.getElementById('api-url').value = currentApiUrl;
        fetchRecords();
      }
    });

    function saveApiUrl() {
      const url = document.getElementById('api-url').value.trim();
      if (!url) return alert('Ingresa una URL válida de Apps Script');
      localStorage.setItem('poc_script_url', url);
      currentApiUrl = url;
      alert('URL guardada correctamente.');
      fetchRecords();
    }

    async function fetchRecords() {
      if (!currentApiUrl) return;
      showLoader(true);
      try {
        const response = await fetch(`${currentApiUrl}?action=read`);
        rawData = await response.json();
        renderRecords(rawData);
      } catch (err) {
        alert('Error al conectar con Google Sheets. Revisa la URL ingresada.');
        console.error(err);
      } finally {
        showLoader(false);
      }
    }

    function renderRecords(records) {
      const listContainer = document.getElementById('records-list');
      listContainer.innerHTML = '';

      if (records.length === 0) {
        listContainer.innerHTML = `<div class="text-center py-10 text-gray-400 text-sm">No hay registros guardados.</div>`;
        return;
      }

      records.forEach(item => {
        const card = document.createElement('div');
        card.className = 'bg-white p-4 rounded-xl shadow-sm border border-gray-100 flex justify-between items-center';
        
        let statusBadge = 'bg-gray-100 text-gray-600';
        if (item.Estado === 'Completado') statusBadge = 'bg-green-100 text-green-700';
        if (item.Estado === 'En Proceso') statusBadge = 'bg-yellow-100 text-yellow-700';
        if (item.Estado === 'Pendiente') statusBadge = 'bg-red-100 text-red-700';

        card.innerHTML = `
          <div class="space-y-1">
            <div class="font-bold text-gray-800 text-sm">${item.Nombre || 'Sin Título'}</div>
            <div class="text-xs text-gray-500">${item.Categoría || 'Sin Categoría'}</div>
            <span class="inline-block text-[10px] px-2 py-0.5 rounded-full font-semibold ${statusBadge}">${item.Estado || 'N/A'}</span>
          </div>
          <div class="flex items-center space-x-2">
            <button onclick='editRecord(${JSON.stringify(item)})' class="p-2 text-indigo-600 hover:bg-indigo-50 rounded-lg">
              <i class="fa-solid fa-pen-to-square"></i>
            </button>
            <button onclick="deleteRecord('${item.ID}')" class="p-2 text-red-500 hover:bg-red-50 rounded-lg">
              <i class="fa-solid fa-trash-can"></i>
            </button>
          </div>
        `;
        listContainer.appendChild(card);
      });
    }

    function filterRecords() {
      const query = document.getElementById('search-input').value.toLowerCase();
      const filtered = rawData.filter(r => 
        (r.Nombre && r.Nombre.toLowerCase().includes(query)) ||
        (r.Categoría && r.Categoría.toLowerCase().includes(query)) ||
        (r.Estado && r.Estado.toLowerCase().includes(query))
      );
      renderRecords(filtered);
    }

    function openModal(mode) {
      document.getElementById('modal').classList.remove('hidden');
      if (mode === 'create') {
        document.getElementById('modal-title').innerText = 'Nuevo Registro';
        document.getElementById('record-form').reset();
        document.getElementById('field-id').value = '';
      }
    }

    function closeModal() {
      document.getElementById('modal').classList.add('hidden');
    }

    function editRecord(item) {
      document.getElementById('modal-title').innerText = 'Editar Registro';
      document.getElementById('field-id').value = item.ID || '';
      document.getElementById('field-nombre').value = item.Nombre || '';
      document.getElementById('field-categoria').value = item.Categoría || '';
      document.getElementById('field-estado').value = item.Estado || 'Pendiente';
      openModal('edit');
    }

    async function handleSubmit(e) {
      e.preventDefault();
      if (!currentApiUrl) return alert('Configura la URL de tu API primero');

      const id = document.getElementById('field-id').value;
      const record = {
        'ID': id,
        'Nombre': document.getElementById('field-nombre').value,
        'Categoría': document.getElementById('field-categoria').value,
        'Estado': document.getElementById('field-estado').value
      };

      const action = id ? 'update' : 'create';
      showLoader(true);
      closeModal();

      try {
        await fetch(currentApiUrl, {
          method: 'POST',
          mode: 'no-cors',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ action: action, record: record })
        });
        
        setTimeout(() => {
          fetchRecords();
        }, 1200);

      } catch (err) {
        alert('Ocurrió un error al guardar.');
        console.error(err);
        showLoader(false);
      }
    }

    async function deleteRecord(id) {
      if (!confirm('¿Estás seguro de eliminar este registro?')) return;
      if (!currentApiUrl) return;

      showLoader(true);
      try {
        await fetch(currentApiUrl, {
          method: 'POST',
          mode: 'no-cors',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ action: 'delete', id: id })
        });

        setTimeout(() => {
          fetchRecords();
        }, 1200);

      } catch (err) {
        alert('Error al eliminar.');
        console.error(err);
        showLoader(false);
      }
    }

    function showLoader(show) {
      const loader = document.getElementById('loader');
      const icon = document.getElementById('refresh-icon');
      if (show) {
        loader.classList.remove('hidden');
        if (icon) icon.classList.add('fa-spin');
      } else {
        loader.classList.add('hidden');
        if (icon) icon.classList.remove('fa-spin');
      }
    }
  </script>
</body>
</html>
